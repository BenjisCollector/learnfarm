<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open Farm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f2ea; --card: #ffffff; --ink: #1f2a21; --muted: #667066; --line: #e4dfd2;
    --green: #2f5d3a; --green-2: #e7f1e2; --amber: #9a6a00; --amber-2: #fff4d6; --blue: #2f6fa3; --blue-2: #e5f0f8;
    --font: 'IBM Plex Sans', 'IBM Plex Sans Arabic', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #e9e5da; color: var(--ink); font-family: var(--font); -webkit-font-smoothing: antialiased; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
  button { font: inherit; color: inherit; cursor: pointer; }
  a { color: var(--blue); }
  .ic { flex: none; display: block; }
  .num { font-variant-numeric: tabular-nums; }

  .phone { max-width: 440px; min-height: 100vh; margin: 0 auto; background: var(--bg); display: flex; flex-direction: column; }
  header { padding: 20px 20px 6px; display: flex; align-items: flex-start; gap: 12px; }
  header[hidden], section[hidden] { display: none; }
  header .t { flex: 1; min-width: 0; }
  h1 { font-size: 28px; font-weight: 700; margin: 0; letter-spacing: -0.3px; }
  .sub { margin: 6px 0 0; color: var(--muted); font-size: 14px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .chip { background: var(--green-2); color: var(--green); border-radius: 999px; padding: 1px 9px; font-weight: 600; font-size: 13px; }
  .sync { width: 7px; height: 7px; border-radius: 50%; background: #43a047; display: inline-block; }
  .sync.off { background: #c62828; }
  .langbtn { height: 38px; min-width: 44px; padding: 0 12px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); font-weight: 600; }

  main { flex: 1; padding: 0 20px 100px; }
  .tabs { display: flex; gap: 8px; overflow-x: auto; padding: 8px 0 12px; scrollbar-width: none; }
  .tabs button { flex: none; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; font-size: 14px; font-weight: 500; }
  .tabs button.on { background: var(--green); border-color: var(--green); color: #fff; }

  .mapwrap { position: relative; border-radius: 18px; overflow: hidden; border: 1px solid var(--line); background: #ecdcae; }
  .mapwrap canvas { width: 100%; height: auto; cursor: pointer; }
  .label { position: absolute; transform: translate(-50%, 0); margin-top: 5px; background: rgba(255,255,255,.95); border-radius: 999px; padding: 1px 8px; font-size: 11px; font-weight: 600; white-space: nowrap; pointer-events: none; box-shadow: 0 1px 2px rgba(0,0,0,.15); }
  .label.on { background: var(--green); color: #fff; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin-top: 16px; }
  .card.hint { background: var(--green-2); border-color: #cfe3c6; }
  .row { display: flex; gap: 12px; align-items: center; }
  .card h3 { margin: 0; font-size: 17px; font-weight: 600; }
  .card p { margin: 3px 0 0; color: var(--muted); font-size: 14px; }
  .xbtn { margin-inline-start: auto; width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; }

  .flow { padding: 14px 0; border-top: 1px solid var(--line); }
  .flow:first-child { border-top: 0; padding-top: 4px; }
  .fhead { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; }
  .dir { font-size: 11px; font-weight: 700; border-radius: 6px; padding: 1px 6px; letter-spacing: .3px; }
  .dir.in { background: var(--blue-2); color: var(--blue); } .dir.out { background: var(--green-2); color: var(--green); }
  .total { margin-inline-start: auto; font-size: 18px; font-weight: 700; }
  .meta { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .trust { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; border-radius: 6px; padding: 1px 7px; margin-top: 8px; }
  .trust.web { background: var(--green-2); color: var(--green); } .trust.ai_report { background: var(--amber-2); color: var(--amber); }
  .links { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 6px; font-size: 13px; }
  .links a { display: inline-flex; align-items: center; gap: 3px; text-decoration: none; }
  .links a:hover { text-decoration: underline; }
  details { margin-top: 6px; font-size: 12px; color: var(--muted); }
  summary { cursor: pointer; }

  .ctrl { display: flex; gap: 12px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px; margin: 8px 0 12px; }
  .ctrl input { flex: 1; accent-color: var(--green); }
  .ctrl b { min-width: 72px; text-align: end; font-size: 14px; }
  .playbtn { width: 38px; height: 38px; border-radius: 12px; border: 0; background: var(--green); color: #fff; display: grid; place-items: center; }
  .note { color: var(--muted); font-size: 13px; margin: 0 2px 12px; }
  .group h3 { margin-bottom: 6px; }

  /* Method */
  .doc h2 { font-size: 20px; margin: 4px 0 8px; }
  .doc h3 { font-size: 16px; margin: 0 0 4px; }
  .doc p, .doc li { font-size: 14px; line-height: 1.55; color: #3b463c; }
  .doc ul { padding-inline-start: 18px; margin: 6px 0 0; }
  .doc .card { margin-top: 12px; }

  /* Weather (only shown with live data) */
  .wx { position: relative; margin: 0 -20px; }
  .wx canvas { width: 100%; height: auto; }
  .wx .top { position: absolute; top: 14px; left: 0; right: 0; display: flex; justify-content: center; }
  .pill { background: rgba(255,255,255,.95); border-radius: 999px; padding: 6px 14px; font-weight: 600; display: inline-flex; gap: 6px; align-items: center; font-size: 14px; }
  .temp { position: absolute; top: 60px; inset-inline-start: 20px; }
  .temp b { font-size: 56px; font-weight: 700; line-height: 1; letter-spacing: -1px; }
  .temp sup { font-size: 20px; font-weight: 600; }
  .temp div { font-size: 18px; font-weight: 600; }
  .modes { position: absolute; top: 160px; inset-inline-start: 20px; display: flex; gap: 2px; background: rgba(255,255,255,.92); border-radius: 999px; padding: 4px; }
  .modes button { width: 34px; height: 34px; border: 0; border-radius: 50%; background: transparent; display: grid; place-items: center; color: var(--green); }
  .modes button.on { background: var(--green); color: #fff; }
  .sheet { background: var(--bg); margin: -18px -20px 0; padding: 22px 20px 18px; border-radius: 22px 22px 0 0; position: relative; }
  .sheet h2 { margin: 0; font-size: 20px; display: flex; justify-content: space-between; align-items: center; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
  .tile small { color: var(--muted); font-size: 13px; display: block; margin-top: 10px; }
  .tile b { font-size: 24px; }

  nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 440px; background: rgba(255,255,255,.97); display: flex; justify-content: space-around; padding: 10px 0 18px; border-top: 1px solid var(--line); backdrop-filter: blur(8px); }
  nav button { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); min-width: 64px; }
  nav button.on { color: var(--green); font-weight: 600; }
</style>
</head>
<body>
<div class="phone">
  <header id="hdr">
    <div class="t"><h1 id="title">Open Farm</h1><p class="sub" id="sub"></p></div>
    <button class="langbtn" id="lang" aria-label="Switch language">ع</button>
  </header>
  <main>
    <section id="s-farm">
      <div class="tabs" id="tabs"></div>
      <div class="mapwrap" dir="ltr"><canvas id="map"></canvas><div id="labels"></div></div>
      <div class="card" id="info"></div>
    </section>
    <section id="s-flows" hidden>
      <div class="ctrl"><button class="playbtn" id="play" aria-label="Play"></button><input type="range" id="day" min="0" max="730" step="1"><b class="num" id="daylbl"></b></div>
      <p class="note" id="flownote"></p>
      <div id="groups"></div>
    </section>
    <section id="s-method" class="doc" hidden></section>
    <section id="s-weather" hidden>
      <div class="wx" dir="ltr">
        <canvas id="wx"></canvas>
        <div class="top"><span class="pill" id="wxloc"></span></div>
        <div class="temp"><b class="num" id="wxtemp"></b><sup>°C</sup><div id="wxcond"></div></div>
        <div class="modes" id="modes"></div>
      </div>
      <div class="sheet">
        <h2><span id="wxh"></span></h2>
        <div class="grid" id="wxgrid"></div>
        <p class="note" id="wxsrc" style="margin-top:12px"></p>
      </div>
    </section>
  </main>
  <nav id="nav"></nav>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
