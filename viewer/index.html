<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open Farm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f2ea; --card: #ffffff; --ink: #1f2a21; --muted: #5f695f; --line: #e1dbcc;
    --green: #2f5d3a; --green-2: #e7f1e2; --amber: #9a6a00; --amber-2: #fff4d6; --red: #c62828; --red-2: #fdecea; --blue: #2f6fa3;
    --font: 'IBM Plex Sans', 'IBM Plex Sans Arabic', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); -webkit-font-smoothing: antialiased; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
  button { font: inherit; color: inherit; cursor: pointer; }
  a { color: var(--blue); }
  .ic { flex: none; display: block; }
  .num { font-variant-numeric: tabular-nums; }
  [hidden] { display: none !important; }

  .app { max-width: 1280px; margin: 0 auto; padding: 0 16px 40px; }
  header { display: flex; align-items: center; gap: 10px; padding: 16px 0 10px; }
  header .t { flex: 1; min-width: 0; }
  h1 { font-size: 24px; font-weight: 700; margin: 0; letter-spacing: -.2px; }
  .sub { margin: 2px 0 0; color: var(--muted); font-size: 14px; display: flex; align-items: center; gap: 6px; }
  .btn { height: 38px; padding: 0 12px; border-radius: 10px; background: var(--card); border: 1px solid var(--line); font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
  .btn:hover { border-color: #c9c1ad; }
  .btn.primary { background: var(--green); border-color: var(--green); color: #fff; }

  .layout { display: grid; gap: 16px; }
  .layout > div { min-width: 0; }
  @media (min-width: 1000px) { .layout { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); align-items: start; } .side { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; } }

  .mapcard { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 10px; }
  .mapwrap { position: relative; border-radius: 12px; overflow: hidden; background: #ecdcae; width: fit-content; max-width: 100%; margin: 0 auto; }
  .mapwrap canvas { width: 100%; height: auto; cursor: pointer; }
  @media (min-width: 1000px) { .mapwrap canvas { width: auto; height: min(68vh, 760px); max-width: 100%; } }
  .label { position: absolute; transform: translate(-50%, 0); margin-top: 4px; background: rgba(255,255,255,.96); border-radius: 7px; padding: 1px 7px; font-size: 11px; font-weight: 600; white-space: nowrap; pointer-events: none; box-shadow: 0 1px 2px rgba(0,0,0,.18); line-height: 1.45; text-align: center; }
  .label small { display: block; font-weight: 500; color: var(--muted); font-size: 10px; }
  .label.on { background: var(--green); color: #fff; } .label.on small { color: #d8ead2; }
  .label.warn { background: var(--red); color: #fff; } .label.warn small { color: #ffd9d6; }
  .maptools { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 2px 2px; font-size: 13px; color: var(--muted); }
  .switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; color: var(--ink); font-weight: 500; }
  .switch input { width: 36px; height: 20px; accent-color: var(--green); }
  .dots { display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .dot { display: inline-flex; align-items: center; gap: 5px; }
  .dot i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; outline: 1px solid rgba(0,0,0,.25); }

  .timebar { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 8px 10px; margin-top: 12px; }
  .timebar input[type=range] { flex: 1 1 120px; accent-color: var(--green); min-width: 0; }
  @media (max-width: 480px) { .timebar { flex-wrap: wrap; } .timebar input[type=range] { order: 5; flex-basis: 100%; } .daylbl { margin-inline-start: auto; } }
  .playbtn { width: 38px; height: 38px; border-radius: 10px; border: 0; background: var(--green); color: #fff; display: grid; place-items: center; flex: none; }
  .daylbl { min-width: 92px; font-weight: 600; font-size: 14px; text-align: end; }
  .daylbl small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; }
  .speeds { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; flex: none; }
  .speeds button { border: 0; background: var(--card); padding: 6px 8px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .speeds button.on { background: var(--green-2); color: var(--green); }
  .hint { color: var(--muted); font-size: 13px; margin: 8px 2px 0; }

  .tabs { display: flex; background: #ebe6da; border-radius: 12px; padding: 4px; gap: 4px; }
  .tabs button { flex: 1; border: 0; background: transparent; border-radius: 9px; padding: 9px 6px; font-weight: 600; font-size: 14px; color: var(--muted); }
  .tabs button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .panel { padding-top: 14px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
  .card.soft { background: var(--green-2); border-color: #cfe3c6; }
  .card h2 { margin: 0 0 6px; font-size: 19px; }
  .card h3 { margin: 0 0 6px; font-size: 16px; }
  .card p { margin: 4px 0; font-size: 14.5px; line-height: 1.55; color: #3b463c; }
  .card ul { margin: 6px 0 0; padding-inline-start: 18px; font-size: 14.5px; line-height: 1.6; color: #3b463c; }
  .lead { font-size: 15px; color: #3b463c; }
  .steps3 { display: grid; gap: 8px; margin: 10px 0 4px; }
  .steps3 div { display: flex; gap: 10px; align-items: flex-start; font-size: 14.5px; line-height: 1.5; }
  .steps3 b.n { flex: none; width: 24px; height: 24px; border-radius: 7px; background: var(--green); color: #fff; display: grid; place-items: center; font-size: 13px; }

  .arealist { display: grid; gap: 6px; margin-top: 8px; }
  .area { display: flex; align-items: center; gap: 10px; width: 100%; text-align: start; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .area:hover { border-color: #c9c1ad; }
  .area b { flex: 1; font-weight: 600; font-size: 14.5px; }
  .area span { color: var(--muted); font-size: 13px; }
  .stat { width: 9px; height: 9px; border-radius: 50%; background: #43a047; flex: none; }
  .stat.warn { background: var(--red); }

  .zhead { display: flex; align-items: flex-start; gap: 10px; }
  .zhead .t { flex: 1; }
  .size { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .xbtn { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; flex: none; }
  .status { border-radius: 10px; padding: 8px 10px; font-size: 14px; margin: 10px 0 2px; background: var(--green-2); color: var(--green); font-weight: 500; }
  .status.warn { background: var(--red-2); color: var(--red); }

  .proc { display: grid; gap: 10px; margin-top: 12px; }
  @media (min-width: 560px) { .proc { grid-template-columns: 1fr auto 1fr; align-items: center; } }
  .col h4 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }
  [dir=rtl] .col h4 { letter-spacing: 0; }
  .item { background: #faf8f3; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin-bottom: 6px; font-size: 14px; }
  .item .r { display: flex; align-items: center; gap: 6px; font-weight: 600; }
  .item .r i { width: 10px; height: 10px; border-radius: 3px; outline: 1px solid rgba(0,0,0,.2); flex: none; }
  .item .amt { margin-inline-start: auto; font-variant-numeric: tabular-nums; }
  .item .w { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .item .w button { border: 0; background: none; padding: 0; color: var(--blue); text-decoration: underline; font-size: 13px; }
  .machine { text-align: center; font-weight: 700; color: var(--green); font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 6px; }
  @media (max-width: 559px) { .machine { flex-direction: column; } }
  .machine div { background: var(--green); color: #fff; border-radius: 12px; padding: 12px 14px; font-size: 14px; }
  .arrow { font-size: 20px; color: var(--muted); }
  @media (max-width: 559px) { .arrow { transform: rotate(90deg); display: inline-block; } }
  [dir=rtl] .arrow { transform: scaleX(-1); display: inline-block; }
  @media (max-width: 559px) { [dir=rtl] .arrow { transform: rotate(90deg); } }
  .group { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 12px; }
  .group:first-of-type { border-top: 0; padding-top: 0; }
  details { margin-top: 10px; font-size: 13px; color: var(--muted); }
  summary { cursor: pointer; color: var(--ink); font-weight: 600; font-size: 14px; }
  .src { padding: 8px 0; border-top: 1px dashed var(--line); }
  .src a { display: inline-flex; gap: 3px; align-items: center; margin-inline-end: 10px; }
  .trust { display: inline-block; font-size: 11px; font-weight: 700; border-radius: 5px; padding: 0 6px; margin-inline-end: 6px; }
  .trust.web { background: var(--green-2); color: var(--green); } .trust.ai_report { background: var(--amber-2); color: var(--amber); }
  .why { background: var(--amber-2); border-radius: 10px; padding: 10px 12px; margin-top: 12px; font-size: 14px; line-height: 1.5; color: #5a4300; }
  .terms { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .terms details { margin: 0; background: #faf8f3; border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; }
  .terms summary { font-size: 13px; font-weight: 500; }
  .terms p { max-width: 300px; }

  .stock { margin-bottom: 12px; }
  .stock .top { display: flex; align-items: center; gap: 10px; }
  .stock .top b { flex: 1; }
  .bar { height: 10px; background: #ece6d8; border-radius: 6px; overflow: hidden; margin: 6px 0 4px; }
  .bar i { display: block; height: 100%; background: var(--blue); border-radius: 6px; }
  .bar.low i { background: var(--red); }
  .meta { color: var(--muted); font-size: 13px; }
  .pill { font-size: 11px; color: var(--muted); border: 1px dashed #cfc7b2; border-radius: 5px; padding: 0 5px; margin-inline-start: 4px; }
  .ev { font-size: 14px; padding: 7px 0; border-top: 1px solid var(--line); line-height: 1.45; }
  .ev:first-of-type { border-top: 0; }
  .ev.bad { color: var(--red); } .ev.good { color: var(--green); }
  .market { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
  .market div { background: #faf8f3; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
  .market b { display: block; font-size: 17px; }
  .market span { font-size: 12px; color: var(--muted); }

  .loopwrap { overflow-x: auto; direction: ltr; }
  svg.loop { width: 100%; min-width: 340px; height: auto; display: block; }
  svg.loop .node rect { fill: #fff; stroke: #d6cfbd; }
  svg.loop .node.pick { cursor: pointer; }
  svg.loop .node.pick:hover rect { stroke: var(--green); }
  svg.loop .node.warn rect { fill: var(--red-2); stroke: var(--red); }
  svg.loop .t { font: 600 9.5px var(--font); fill: var(--ink); }
  svg.loop .s { font: 500 8px var(--font); fill: var(--muted); }

  .tour { position: fixed; inset: auto 12px 12px 12px; z-index: 20; max-width: 440px; margin: 0 auto; background: var(--ink); color: #fff; border-radius: 16px; padding: 16px; box-shadow: 0 20px 40px rgba(0,0,0,.3); }
  .tour h3 { margin: 0 0 6px; font-size: 16px; }
  .tour p { margin: 0 0 12px; font-size: 14.5px; line-height: 1.5; color: #dfe7dc; }
  .tour .row { display: flex; align-items: center; gap: 10px; }
  .tour .row span { flex: 1; font-size: 12px; color: #b9c6b6; }
  .tour .btn { background: #fff; color: var(--ink); border: 0; }
  .tour .skip { background: transparent; color: #dfe7dc; border: 1px solid #55625a; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="t"><h1 id="title">Open Farm</h1><p class="sub" id="sub"></p></div>
    <button class="btn" id="tourbtn"></button>
    <button class="btn" id="lang" aria-label="Switch language">عربي</button>
  </header>
  <div class="layout">
    <div>
      <div class="mapcard">
        <div class="mapwrap" dir="ltr"><canvas id="map"></canvas><div id="labels"></div></div>
        <div class="maptools">
          <label class="switch"><input type="checkbox" id="links" checked><span id="linkslbl"></span></label>
          <div class="dots" id="legend"></div>
        </div>
      </div>
      <div class="timebar">
        <button class="playbtn" id="play"></button>
        <input type="range" id="day" min="0" max="730" step="1" aria-label="Day">
        <div class="speeds" id="speeds"></div>
        <div class="daylbl num" id="daylbl"></div>
      </div>
      <p class="hint" id="timehint"></p>
    </div>
    <div class="side">
      <div class="tabs" id="tabs"></div>
      <div class="panel" id="panel"></div>
    </div>
  </div>
</div>
<div class="tour" id="tour" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
